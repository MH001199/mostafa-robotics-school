<svg xmlns="http://www.w3.org/2000/svg" width="920" height="406" viewBox="0 0 920 406" role="img"><title>LDR night light</title><desc>Arduino Uno R3 · Wiring by pin label · Disconnect all power before wiring</desc><rect width="920" height="406" rx="22" fill="#f5f8fc"/><path d="M0 22Q0 0 22 0H898Q920 0 920 22V93H0Z" fill="#14243b"/><g font-family="system-ui, sans-serif"><text x="26" y="42" font-size="26" font-weight="700" fill="#fff">LDR night light</text><text x="26" y="72" font-size="14" fill="#d6e8f8">Arduino Uno R3 · Wiring by pin label · Disconnect all power before wiring</text><text x="26" y="117" fill="#14243b" font-weight="700" font-size="18">LDR voltage divider</text><rect x="26" y="135" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="135" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="151" y2="151" stroke="#126988" stroke-width="3"/><circle cx="350" cy="151" r="5" fill="#126988"/><circle cx="434" cy="151" r="5" fill="#126988"/><text x="40" y="157" font-size="15" fill="#14243b">Uno 5V</text><text x="456" y="157" font-size="15" fill="#14243b">LDR → junction</text><rect x="26" y="174" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="174" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="190" y2="190" stroke="#126988" stroke-width="3"/><circle cx="350" cy="190" r="5" fill="#126988"/><circle cx="434" cy="190" r="5" fill="#126988"/><text x="40" y="196" font-size="15" fill="#14243b">Divider junction</text><text x="456" y="196" font-size="15" fill="#14243b">Uno A0</text><rect x="26" y="213" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="213" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="229" y2="229" stroke="#126988" stroke-width="3"/><circle cx="350" cy="229" r="5" fill="#126988"/><circle cx="434" cy="229" r="5" fill="#126988"/><text x="40" y="235" font-size="15" fill="#14243b">Divider junction</text><text x="456" y="235" font-size="15" fill="#14243b">10 kΩ → Uno GND</text><text x="26" y="270" fill="#14243b" font-weight="700" font-size="18">LED and series resistor</text><rect x="26" y="288" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="288" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="304" y2="304" stroke="#126988" stroke-width="3"/><circle cx="350" cy="304" r="5" fill="#126988"/><circle cx="434" cy="304" r="5" fill="#126988"/><text x="40" y="310" font-size="15" fill="#14243b">D8</text><text x="456" y="310" font-size="15" fill="#14243b">330 Ω → LED anode</text><rect x="26" y="327" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="327" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="343" y2="343" stroke="#126988" stroke-width="3"/><circle cx="350" cy="343" r="5" fill="#126988"/><circle cx="434" cy="343" r="5" fill="#126988"/><text x="40" y="349" font-size="15" fill="#14243b">LED cathode</text><text x="456" y="349" font-size="15" fill="#14243b">Uno GND</text><text x="26" y="382" font-size="14" fill="#14243b">Read each line as one connection. A repeated junction label means the same electrical node.</text></g></svg>
