<svg xmlns="http://www.w3.org/2000/svg" width="920" height="253" viewBox="0 0 920 253" role="img"><title>Passive piezo musical notes</title><desc>Arduino Uno R3 · Wiring by pin label · Disconnect all power before wiring</desc><rect width="920" height="253" rx="22" fill="#f5f8fc"/><path d="M0 22Q0 0 22 0H898Q920 0 920 22V93H0Z" fill="#14243b"/><g font-family="system-ui, sans-serif"><text x="26" y="42" font-size="26" font-weight="700" fill="#fff">Passive piezo musical notes</text><text x="26" y="72" font-size="14" fill="#d6e8f8">Arduino Uno R3 · Wiring by pin label · Disconnect all power before wiring</text><text x="26" y="117" fill="#14243b" font-weight="700" font-size="18">Passive piezo and resistor</text><rect x="26" y="135" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="135" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="151" y2="151" stroke="#126988" stroke-width="3"/><circle cx="350" cy="151" r="5" fill="#126988"/><circle cx="434" cy="151" r="5" fill="#126988"/><text x="40" y="157" font-size="15" fill="#14243b">D8</text><text x="456" y="157" font-size="15" fill="#14243b">330 Ω → passive piezo (+)</text><rect x="26" y="174" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="174" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="190" y2="190" stroke="#126988" stroke-width="3"/><circle cx="350" cy="190" r="5" fill="#126988"/><circle cx="434" cy="190" r="5" fill="#126988"/><text x="40" y="196" font-size="15" fill="#14243b">Piezo (−)</text><text x="456" y="196" font-size="15" fill="#14243b">Uno GND</text><text x="26" y="229" font-size="14" fill="#14243b">Read each line as one connection. A repeated junction label means the same electrical node.</text></g></svg>
