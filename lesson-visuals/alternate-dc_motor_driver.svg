<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img"><title>TB6612FNG motor control</title><desc>Arduino Uno R3 · Wiring by pin label · Disconnect all power before wiring</desc><rect width="920" height="640" rx="22" fill="#f5f8fc"/><path d="M0 22Q0 0 22 0H898Q920 0 920 22V93H0Z" fill="#14243b"/><g font-family="system-ui, sans-serif"><text x="26" y="42" font-size="26" font-weight="700" fill="#fff">TB6612FNG motor control</text><text x="26" y="72" font-size="14" fill="#d6e8f8">Arduino Uno R3 · Wiring by pin label · Disconnect all power before wiring</text><text x="26" y="117" fill="#14243b" font-weight="700" font-size="18">10 kΩ potentiometer</text><rect x="26" y="135" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="135" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="151" y2="151" stroke="#126988" stroke-width="3"/><circle cx="350" cy="151" r="5" fill="#126988"/><circle cx="434" cy="151" r="5" fill="#126988"/><text x="40" y="157" font-size="15" fill="#14243b">Uno 5V and GND</text><text x="456" y="157" font-size="13" fill="#14243b">Potentiometer outer terminals, one each</text><rect x="26" y="174" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="174" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="190" y2="190" stroke="#126988" stroke-width="3"/><circle cx="350" cy="190" r="5" fill="#126988"/><circle cx="434" cy="190" r="5" fill="#126988"/><text x="40" y="196" font-size="15" fill="#14243b">Center wiper</text><text x="456" y="196" font-size="15" fill="#14243b">Uno A0</text><text x="26" y="231" fill="#14243b" font-weight="700" font-size="18">TB6612FNG driver and 6 V brushed DC motor</text><rect x="26" y="249" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="249" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="265" y2="265" stroke="#126988" stroke-width="3"/><circle cx="350" cy="265" r="5" fill="#126988"/><circle cx="434" cy="265" r="5" fill="#126988"/><text x="40" y="271" font-size="15" fill="#14243b">D6</text><text x="456" y="271" font-size="15" fill="#14243b">PWMA</text><rect x="26" y="288" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="288" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="304" y2="304" stroke="#126988" stroke-width="3"/><circle cx="350" cy="304" r="5" fill="#126988"/><circle cx="434" cy="304" r="5" fill="#126988"/><text x="40" y="310" font-size="15" fill="#14243b">D8 / D9</text><text x="456" y="310" font-size="15" fill="#14243b">AIN1 / AIN2, respectively</text><rect x="26" y="327" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="327" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="343" y2="343" stroke="#126988" stroke-width="3"/><circle cx="350" cy="343" r="5" fill="#126988"/><circle cx="434" cy="343" r="5" fill="#126988"/><text x="40" y="349" font-size="15" fill="#14243b">D12</text><text x="456" y="349" font-size="15" fill="#14243b">STBY and 10 kΩ → GND</text><rect x="26" y="366" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="366" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="382" y2="382" stroke="#126988" stroke-width="3"/><circle cx="350" cy="382" r="5" fill="#126988"/><circle cx="434" cy="382" r="5" fill="#126988"/><text x="40" y="388" font-size="15" fill="#14243b">Uno 5V</text><text x="456" y="388" font-size="15" fill="#14243b">VCC</text><rect x="26" y="405" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="405" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="421" y2="421" stroke="#126988" stroke-width="3"/><circle cx="350" cy="421" r="5" fill="#126988"/><circle cx="434" cy="421" r="5" fill="#126988"/><text x="40" y="427" font-size="15" fill="#14243b">External 6 V (+)</text><text x="456" y="427" font-size="15" fill="#14243b">VM</text><rect x="26" y="444" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="444" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="460" y2="460" stroke="#126988" stroke-width="3"/><circle cx="350" cy="460" r="5" fill="#126988"/><circle cx="434" cy="460" r="5" fill="#126988"/><text x="40" y="466" font-size="15" fill="#14243b">External supply (−), Uno GND</text><text x="456" y="466" font-size="15" fill="#14243b">Driver GND</text><rect x="26" y="483" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="483" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="499" y2="499" stroke="#126988" stroke-width="3"/><circle cx="350" cy="499" r="5" fill="#126988"/><circle cx="434" cy="499" r="5" fill="#126988"/><text x="40" y="505" font-size="15" fill="#14243b">AO1 / AO2</text><text x="456" y="505" font-size="15" fill="#14243b">One motor lead each</text><rect x="26" y="522" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="522" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="538" y2="538" stroke="#126988" stroke-width="3"/><circle cx="350" cy="538" r="5" fill="#126988"/><circle cx="434" cy="538" r="5" fill="#126988"/><text x="40" y="544" font-size="15" fill="#14243b">Driver BIN1, BIN2, PWMB</text><text x="456" y="544" font-size="15" fill="#14243b">GND</text><rect x="26" y="561" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="561" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="577" y2="577" stroke="#126988" stroke-width="3"/><circle cx="350" cy="577" r="5" fill="#126988"/><circle cx="434" cy="577" r="5" fill="#126988"/><text x="40" y="583" font-size="15" fill="#14243b">Driver BO1 / BO2</text><text x="456" y="583" font-size="15" fill="#14243b">Leave disconnected</text><text x="26" y="616" font-size="14" fill="#14243b">Read each line as one connection. A repeated junction label means the same electrical node.</text></g></svg>
