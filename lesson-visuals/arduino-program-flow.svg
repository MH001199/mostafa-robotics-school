<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 245" role="img"><title>Arduino compile and execution flow</title><rect width="900" height="245" rx="18" fill="#f4f8fc"/><g style="font-family:system-ui,sans-serif" fill="#14243b"><text x="30" y="45" font-size="25">How Arduino code becomes a running program</text><rect x="26" y="84" width="193" height="83" rx="13" fill="#e0eef6"/><text x="39" y="115" font-size="20">Build</text><text x="39" y="145" font-size="14">Compile and upload</text><text x="223" y="133" font-size="21">→</text><rect x="246" y="84" width="193" height="83" rx="13" fill="#e0eef6"/><text x="259" y="115" font-size="20">Start or reset</text><text x="259" y="145" font-size="14">Initialize global data</text><text x="443" y="133" font-size="21">→</text><rect x="466" y="84" width="193" height="83" rx="13" fill="#e0eef6"/><text x="479" y="115" font-size="20">Setup</text><text x="479" y="145" font-size="14">Run once</text><text x="663" y="133" font-size="21">→</text><rect x="686" y="84" width="193" height="83" rx="13" fill="#e0eef6"/><text x="699" y="115" font-size="20">Loop</text><text x="699" y="145" font-size="14">Repeat while powered</text><path d="M780 168V196H846V168" fill="none" stroke="#007785" stroke-width="3"/><text x="32" y="218" font-size="17">The computer builds the program. The Uno initializes it and keeps running it.</text></g></svg>
