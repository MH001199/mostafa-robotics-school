<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img"><title>PWM waveforms at 25, 50 and 75 percent</title><rect width="900" height="310" rx="18" fill="#f4f8fc"/><g style="font-family:system-ui,sans-serif" fill="#14243b"><text x="25" y="37" font-size="25">PWM duty cycle on a 5 V digital output</text><text x="36" y="92" font-size="20">25% duty</text><text x="145" y="75" font-size="13">HIGH</text><text x="150" y="115" font-size="13">LOW</text><path d="M245 112V72H308V112H497V72H560V112H749" fill="none" stroke="#007785" stroke-width="4"/><text x="36" y="157" font-size="20">50% duty</text><text x="145" y="140" font-size="13">HIGH</text><text x="150" y="180" font-size="13">LOW</text><path d="M245 177V137H371V177H497V137H623V177H749" fill="none" stroke="#007785" stroke-width="4"/><text x="36" y="222" font-size="20">75% duty</text><text x="145" y="205" font-size="13">HIGH</text><text x="150" y="245" font-size="13">LOW</text><path d="M245 242V202H434V242H497V202H686V242H749" fill="none" stroke="#007785" stroke-width="4"/><text x="245" y="287" font-size="16">← one period →</text><text x="496" y="287" font-size="16">← next period →</text></g></svg>
