<svg xmlns="http://www.w3.org/2000/svg" width="920" height="481" viewBox="0 0 920 481" role="img"><title>Digital and analog I/O</title><desc>Arduino Uno R3 · Wiring by pin label · Disconnect all power before wiring</desc><rect width="920" height="481" rx="22" fill="#f5f8fc"/><path d="M0 22Q0 0 22 0H898Q920 0 920 22V93H0Z" fill="#14243b"/><g font-family="system-ui, sans-serif"><text x="26" y="42" font-size="26" font-weight="700" fill="#fff">Digital and analog I/O</text><text x="26" y="72" font-size="14" fill="#d6e8f8">Arduino Uno R3 · Wiring by pin label · Disconnect all power before wiring</text><text x="26" y="117" fill="#14243b" font-weight="700" font-size="18">Normally open pushbutton</text><rect x="26" y="135" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="135" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="151" y2="151" stroke="#126988" stroke-width="3"/><circle cx="350" cy="151" r="5" fill="#126988"/><circle cx="434" cy="151" r="5" fill="#126988"/><text x="40" y="157" font-size="15" fill="#14243b">D2</text><text x="456" y="157" font-size="15" fill="#14243b">One switched contact</text><rect x="26" y="174" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="174" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="190" y2="190" stroke="#126988" stroke-width="3"/><circle cx="350" cy="190" r="5" fill="#126988"/><circle cx="434" cy="190" r="5" fill="#126988"/><text x="40" y="196" font-size="15" fill="#14243b">Other switched contact</text><text x="456" y="196" font-size="15" fill="#14243b">Uno GND</text><text x="26" y="231" fill="#14243b" font-weight="700" font-size="18">10 kΩ potentiometer</text><rect x="26" y="249" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="249" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="265" y2="265" stroke="#126988" stroke-width="3"/><circle cx="350" cy="265" r="5" fill="#126988"/><circle cx="434" cy="265" r="5" fill="#126988"/><text x="40" y="271" font-size="15" fill="#14243b">Uno 5V and GND</text><text x="456" y="271" font-size="13" fill="#14243b">Potentiometer outer terminals, one each</text><rect x="26" y="288" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="288" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="304" y2="304" stroke="#126988" stroke-width="3"/><circle cx="350" cy="304" r="5" fill="#126988"/><circle cx="434" cy="304" r="5" fill="#126988"/><text x="40" y="310" font-size="15" fill="#14243b">Center wiper</text><text x="456" y="310" font-size="15" fill="#14243b">Uno A0</text><text x="26" y="345" fill="#14243b" font-weight="700" font-size="18">Onboard L LED</text><rect x="26" y="363" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="363" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="379" y2="379" stroke="#126988" stroke-width="3"/><circle cx="350" cy="379" r="5" fill="#126988"/><circle cx="434" cy="379" r="5" fill="#126988"/><text x="40" y="385" font-size="15" fill="#14243b">USB port</text><text x="456" y="385" font-size="15" fill="#14243b">Computer USB data cable</text><rect x="26" y="402" width="315" height="33" rx="8" fill="#deebf9"/><rect x="443" y="402" width="451" height="33" rx="8" fill="#e9f7fa"/><line x1="341" x2="443" y1="418" y2="418" stroke="#126988" stroke-width="3"/><circle cx="350" cy="418" r="5" fill="#126988"/><circle cx="434" cy="418" r="5" fill="#126988"/><text x="40" y="424" font-size="15" fill="#14243b">Onboard D13 / L</text><text x="456" y="424" font-size="15" fill="#14243b">No external connection for L</text><text x="26" y="457" font-size="14" fill="#14243b">Read each line as one connection. A repeated junction label means the same electrical node.</text></g></svg>
