name: Report a wiring error
description: Report an incorrect pin, part, diagram, or safety instruction
title: "[wiring-error] "
body:
  - type: input
    id: context
    attributes:
      label: Lesson URL and hardware kit
      description: Include the model names or say that the request applies to the whole school.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Wiring or safety issue
      description: What differs between the pin table, sketch, diagram, and observed circuit? Disconnect power if needed.
    validations:
      required: true
