name: Report a code bug
description: Report a compile error or reproducible sketch behavior
title: "[code-bug] "
body:
  - type: input
    id: context
    attributes:
      label: Lesson URL and hardware kit
      description: Include the model names or say that the request applies to the whole school.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Code behavior
      description: What did you expect and observe? Include board and library versions and the shortest relevant log.
    validations:
      required: true
