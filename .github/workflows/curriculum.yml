name: Curriculum verification and Pages

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sketches:
    name: Compile all Uno R3 sketches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install pinned board platform and sensor libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install "DHT sensor library@1.4.6" "Adafruit Unified Sensor@1.1.15"
      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sketches=(class-1/*/*/*.ino class-2/*/*/*.ino student-course/sketches/*/*.ino Class-01-Arduino-Fundamentals/00-Introduction/*/*.ino)
          test "${#sketches[@]}" -gt 0
          for sketch in "${sketches[@]}"; do
            arduino-cli compile --fqbn arduino:avr:uno --warnings all "${sketch%/*}"
          done

  docs:
    name: Verify and build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python tools/simulations.py --check
      - run: python tools/site.py build
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [sketches, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
